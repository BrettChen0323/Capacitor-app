name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 整理目录（把根目录的散文件放回文件夹）
        run: |
          mkdir -p app www tools resources
          if [ -f prototype.html ]; then mv prototype.html app/; fi
          for f in index.html notify.js shell.js; do if [ -f "$f" ]; then mv "$f" www/; fi; done
          for f in pack.js patch_android.py generate_icons.py; do if [ -f "$f" ]; then mv "$f" tools/; fi; done
          for f in icon-*.png ic_*.png; do if [ -f "$f" ]; then mv "$f" resources/; fi; done
          rm -f android.yml download
          echo '--- 整理后 ---'
          ls -1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成 www（原型 + 通知脚本）
        run: npm run pack

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 同步 web 资源
        run: npx cap sync android

      - name: 补权限与图标
        run: python3 tools/patch_android.py

      - name: 打 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 课表工具-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
